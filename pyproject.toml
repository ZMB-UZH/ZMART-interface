[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zmart-interface"
version = "0.2.0rc4"
description = "The ZMART operator window: walk a smart-microscopy run step by step, on any microscope the ZMART Controller drives."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thom de Hoog", email = "thom.dehoog@zmb.uzh.ch" }]
keywords = ["microscopy", "smart microscopy", "operator interface", "ome-zarr", "ome-tiff"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Acquisition",
]
# What the interface needs to run. The ZMART packages are not on PyPI, so
# they are installed from their own repositories, each pinned to a release:
# the versions written here are the ones that were tested together.
dependencies = [
    # The one way to drive any microscope; every command goes through it. The
    # interface opens a ZmartController of its own and lists the drivers the
    # controller's registry knows. Its acquire is given the kind of acquisition
    # and the folder to save in.
    "zmart-controller @ git+https://github.com/ZMB-UZH/ZMART-controller@v0.4.0rc9",
    # The picture server that shows the run as it is acquired. Pinned to a
    # release, because the page is built with the viewer's drawing files: the
    # build stops when the installed viewer is not this one.
    "zmart-viewer @ git+https://github.com/ZMB-UZH/ZMART-viewer@v0.5.0rc11",
    # The engine that scores focus and finds objects, each step in its own
    # environment (the zmart_analysis package). Its workflows stay in a
    # checkout of the repository; see examples/target_acquisition/analysis/workflows.py.
    "zmart-analysis @ git+https://github.com/ZMB-UZH/ZMART-analysis@v0.6.0rc10",
    # Reading and writing the OME-Zarr positions a run can be kept as.
    "ngio==1.1.0",
    "zarr>=3,<4",
    "numpy>=1.24",
    # Reading the image files a microscope writes, and writing the OME-TIFF
    # positions a run can be kept as.
    "tifffile>=2024.1",
    # The small pictures beside the canvas, and the detection masks.
    "pillow>=10",
    # Image filters for the analysis steps run in this process, and the blur of
    # the synthetic pixels for the LAS X simulator. The mock's kidney section
    # itself ships with the package, so nothing is downloaded.
    "scikit-image>=0.22",
    "scipy>=1.10",
    # The analysis engine reads its pipelines from YAML.
    "pyyaml>=6",
    # Checking that the installed viewer is a version this interface was tested with.
    "packaging>=23",
    # The operator window itself (WebView2 on Windows, Chromium through Qt on a Mac).
    "pywebview>=5",
    "pywebview[pyside6]>=5; sys_platform == 'darwin'",
]

[project.optional-dependencies]
# The drivers for real microscopes. Install the extra of the driver too, for
# example the Leica's: pip install "zmart-drivers[leica] @ git+...".
drivers = ["zmart-drivers @ git+https://github.com/ZMB-UZH/ZMART-drivers@v0.7.0b10"]
# What working on the interface needs beyond running it: pytest, the reader
# of the OME description inside a TIFF, which the analysis steps run in-process
# use, and ruff, which checks the Python as the automatic checks do (pinned, so
# a new ruff release cannot fail a change nobody made). The page's own tools
# come from npm (see README.md).
dev = ["pytest>=8", "ome-types>=0.5", "ruff==0.12.12"]

[project.urls]
Repository = "https://github.com/ZMB-UZH/ZMART-interface"
"ZMART Microscopy" = "https://github.com/ZMB-UZH/ZMART-microscopy"

[project.scripts]
zmart-interface = "zmart_interface.launcher:main"

[tool.setuptools.packages.find]
include = ["zmart_interface*"]
namespaces = false

# The package is the framework alone. It brings no workflow and no built page:
# a page is built from a folder of workflows, and the built page lives in that
# folder (see docs/running-your-own-workflows.md). This repository's own example,
# examples/target_acquisition, is there to test the framework and to learn
# from, and is not installed. The Python tests beside the code stay behind
# too; setup.py says how.

[tool.pytest.ini_options]
testpaths = ["zmart_interface", "examples"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules", "examples/built-page"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# UP038 (`X | Y` in isinstance) is deprecated by ruff itself: the tuple form is
# faster and just as clear.
ignore = ["E501", "B008", "UP038"]
